# .ts 側 (src/**/styles.ts の共有クラス文字列など) に任意の文字サイズ (text-[13px] など) を書かない
id: no-arbitrary-text-size-styles
language: typescript
severity: error
message: 文字サイズは text-xs〜text-4xl のスケールから選ぶ
note: .local/design/tokens.md の対応表 (12px 以下 -> text-xs, 13px -> text-sm, 15px -> text-base, 17px -> text-lg …)
files:
  - src/**/*.ts
rule:
  all:
    - any:
        - kind: string
        - kind: template_string
    - regex: 'text-\[(?:length:)?[0-9.]+(?:px|rem|em|pt|%)?\]'
    - not:
        has:
          any:
            - kind: string
            - kind: template_string
          regex: 'text-\[(?:length:)?[0-9.]+(?:px|rem|em|pt|%)?\]'
          stopBy: end
