# Git hooks managed by lefthook. `npm install` installs them; `npx lefthook install` re-installs.
pre-commit:
  parallel: true
  skip:
    - merge
    - rebase
  commands:
    biome:
      glob: "*.{js,mjs,cjs,ts,mts,cts,jsx,tsx,json,jsonc,css}"
      run: npx biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true

pre-push:
  parallel: true
  commands:
    typecheck:
      run: npm run typecheck
    test:
      run: npx vitest run --changed origin/main --passWithNoTests
