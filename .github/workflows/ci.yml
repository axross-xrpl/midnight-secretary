name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      - run: npm test

  # Compiles every contract under contract/compact with the pinned compiler.
  # A Compact contract that compiles is the entry condition of the buildathon.
  compact:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contract
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: contract/package-lock.json

      # The version must match COMPILER_VERSION in contract/scripts/compile.sh.
      - uses: midnightntwrk/setup-compact-action@v1
        with:
          compact-version: "0.31.1"

      - run: npm ci

      # --skip-zk leaves out the proving keys; the circuits and the TypeScript bindings are still generated.
      - run: npm run compile

      # The scripts under contract/src import the generated bindings, so they only typecheck after compile.
      - run: npm run typecheck
